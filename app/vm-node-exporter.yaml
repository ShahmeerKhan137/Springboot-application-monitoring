apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vm-node-exporter
  labels:
    release: monitoring
spec:
  endpoints:
    - port: metrics
      interval: 15s
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: vm-node-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: vm-node-exporter
  labels:
    app: vm-node-exporter
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vm-node-exporter
subsets:
  - addresses:
      - ip: 192.168.100.12
    ports:
      - port: 9100
